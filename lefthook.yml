# No tests run here. The pre-push branch gate runs each test that the branch's
# diff reaches, and that set holds each commit's related tests. A test job here
# ran those files twice: 261 files for one helper edit.
pre-commit:
  jobs:
    - name: biome check
      run: pnpm biome check --staged --no-errors-on-unmatched

pre-push:
  jobs:
    # `pnpm check` runs Biome and Knip on the repository, then check-types,
    # test:changed, and test:workspace for the packages that the branch
    # changes against origin/main. Turbo caches each task, so a push after
    # `pnpm check` with no edit replays the results. CI runs the full gate and
    # gates merges.
    - name: check
      run: pnpm check

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm commitlint --edit {1}
