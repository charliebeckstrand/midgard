# No tests run here. The pre-push branch gate runs each test that the branch's
# diff reaches, and that set holds each commit's related tests. A test job here
# ran those files twice: 261 files for one helper edit.
pre-commit:
  jobs:
    - name: biome check
      run: pnpm biome check --staged --no-errors-on-unmatched

pre-push:
  parallel: true
  jobs:
    - name: biome check
      run: pnpm biome check .
    # test:changed scopes Vitest to the merge-base diff, so this gate's cost
    # tracks the push, not the suite; CI runs the full gate and gates merges.
    - name: branch gate
      run: pnpm turbo run check-types test:changed --affected
    - name: knip
      run: pnpm turbo run knip

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm commitlint --edit {1}
