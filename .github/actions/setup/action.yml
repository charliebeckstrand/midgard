name: Setup
description: Install pnpm, Node, and the workspace dependencies.

# Each job in ci.yml and pr-title.yml starts with these steps. One copy keeps
# the pnpm, Node, and install settings the same in every job. The job must
# check out the repository first, because GitHub reads a local action from the
# checkout.
inputs:
  install-args:
    description: The arguments for `pnpm install`.
    default: --frozen-lockfile

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    # .node-version at the repository root is the one statement of the Node
    # version. Local version managers read the same file.
    - uses: actions/setup-node@v7
      with:
        node-version-file: .node-version
        cache: pnpm
    # pnpm checks the lockfile against the supply-chain policies of
    # pnpm-workspace.yaml before it installs. On CI the check took 5.6 s, and
    # the install about 6 s. pnpm writes each lockfile that passes to this log,
    # with the hash of the lockfile and the policies, and does not check that
    # lockfile again. A change to the lockfile or to the policies gets a full
    # check. The key follows the files that can change the check, so a new log
    # starts when one of them changes. The log of an earlier key is restored
    # first, and pnpm adds the new lockfile to it.
    - uses: actions/cache@v6
      with:
        path: ~/.cache/pnpm/lockfile-verified.jsonl
        key: ${{ runner.os }}-pnpm-verified-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-verified-
    - run: pnpm install ${{ inputs.install-args }}
      shell: bash
