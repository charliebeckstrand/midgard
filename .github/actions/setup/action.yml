name: Setup
description: Install pnpm, Node, and the workspace dependencies.

# Each job in ci.yml and pr-title.yml starts with these steps. One copy keeps
# the pnpm, Node, and install settings the same in every job. The job must
# check out the repository first, because GitHub reads a local action from the
# checkout.
inputs:
  install-args:
    description: The arguments for `pnpm install`.
    default: --frozen-lockfile

runs:
  using: composite
  steps:
    # pnpm/setup installs the native pnpm of `packageManager` in package.json,
    # and the Node of .node-version at the repository root. .node-version is
    # the one statement of the Node version, and local version managers read
    # the same file. pnpm/action-setup installed a pnpm v11 with npm and then
    # changed it to the pinned version, which took about 6 s of each job.
    #
    # The action keeps the pnpm store in the cache of actions/cache, keyed on
    # the lockfile. It also keeps the log of pnpm's supply-chain check of the
    # lockfile, so pnpm checks a lockfile one time and not in each job. The
    # install is the next step, because the action cannot take the arguments of
    # the install.
    - uses: pnpm/setup@v3
      with:
        cache: true
        install: false
    - run: pnpm install ${{ inputs.install-args }}
      shell: bash
