name: Playwright
description: Restore the Playwright browsers from the cache, and install them on a miss.

# Each job that runs a browser uses this action after `setup`: `browser`,
# `density`, and `docs` in ci.yml, visual.yml, and browser-stress.yml. One copy
# keeps the cache key the same in each job that installs the same browsers, so
# those jobs share one cache entry.
#
# `browsers` defaults to Chromium. Each instance of vitest.browser.config.ts
# uses Chromium, except `density-firefox` and `density-webkit`, and only the
# `density` job runs those two. Only that job installs Firefox and WebKit, so
# each other job downloads and restores Chromium only.
#
# The download of Chromium is ~170MB, so the key is the inputs that decide the
# browser builds: the resolved `playwright` version, which `pnpm install` has
# already put on disk, and the browser list. A lockfile hash missed on every
# dependency bump, and `rangeStrategy: update-lockfile` makes each bot pull
# request one. The list is in the key because actions/cache does not save on a
# hit. With one key for two lists, the job that saved first would decide the
# entry for each job: the other list would download its browsers on each run,
# or restore browsers that it does not use. There is no restore key: a prefix
# match would give back a superseded revision that `install` then downloads
# beside it, so the cache would hold both. `install` is idempotent. On a hit,
# it skips the download.
inputs:
  browsers:
    description: The Playwright browsers to install, separated by spaces.
    required: false
    default: chromium

outputs:
  executable:
    description: The path of the Playwright Chromium executable.
    value: ${{ steps.playwright.outputs.executable }}

runs:
  using: composite
  steps:
    - id: playwright
      working-directory: packages/ui
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
      run: |
        echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
        echo "executable=$(node -p "require('playwright').chromium.executablePath()")" >> "$GITHUB_OUTPUT"
        echo "browsers=$(echo $BROWSERS | tr ' ' '-')" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}-${{ steps.playwright.outputs.browsers }}
    # Chromium alone installs with no system packages. The runner image already
    # holds each library that headless Chromium loads. `--with-deps` ran apt
    # on each run, and apt fetched about 35 MB from the Ubuntu mirrors: newer
    # builds of ten of those libraries, and the font packages. A slow mirror
    # stalled the step, and a run could hang until its time limit. The
    # browser suite passes without those fonts. If a runner image drops a
    # library, Chromium does not launch, and the error names the library.
    # Put `--with-deps` back then.
    #
    # Each other list installs with `--with-deps`. No run showed that the
    # runner image holds each library that Firefox and WebKit load, and the
    # cache holds no system package. Only the `density` job pays that apt run.
    - shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
        DEPS: ${{ inputs.browsers != 'chromium' && '--with-deps' || '' }}
      # Not quoted: the list splits into one argument for each browser.
      run: pnpm --filter ui exec playwright install $DEPS $BROWSERS
