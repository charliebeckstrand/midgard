name: Playwright
description: Restore Playwright Chromium from the cache, and install it on a miss.

# Each job that runs Chromium uses this action after `setup`: `browser` and
# `docs` in ci.yml, visual.yml, and browser-stress.yml. One copy keeps the
# cache key the same in each job, so those jobs share one cache entry.
#
# The `density` job does not use this action. It runs Firefox and WebKit in
# the Playwright container image, which holds the browsers and their system
# packages (ci.yml).
#
# The download of Chromium is ~170MB, so the key is the input that decides the
# browser build: the resolved `playwright` version, which `pnpm install` has
# already put on disk. A lockfile hash missed on every dependency bump, and
# `rangeStrategy: update-lockfile` makes each bot pull request one. There is
# no restore key: a prefix match would give back a superseded revision that
# `install` then downloads beside it, so the cache would hold both. `install`
# is idempotent. On a hit, it skips the download.
outputs:
  executable:
    description: The path of the Playwright Chromium executable.
    value: ${{ steps.playwright.outputs.executable }}

runs:
  using: composite
  steps:
    - id: playwright
      working-directory: packages/ui
      shell: bash
      run: |
        echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
        echo "executable=$(node -p "require('playwright').chromium.executablePath()")" >> "$GITHUB_OUTPUT"
    # The key ends in `chromium`, as when the action took a browser list, so
    # the entry that the jobs already share stays valid.
    - uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}-chromium
    # Chromium installs with no system packages. The runner image already
    # holds each library that headless Chromium loads. `--with-deps` ran apt
    # on each run, and apt fetched about 35 MB from the Ubuntu mirrors: newer
    # builds of ten of those libraries, and the font packages. A slow mirror
    # stalled the step, and a run could hang until its time limit. The
    # browser suite passes without those fonts. If a runner image drops a
    # library, Chromium does not launch, and the error names the library.
    # Put `--with-deps` back then.
    - shell: bash
      run: pnpm --filter ui exec playwright install chromium
