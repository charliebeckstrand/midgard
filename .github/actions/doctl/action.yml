name: doctl
description: Install one pinned build of doctl, the DigitalOcean CLI.

# The digitalocean/app_action action is a Docker action. The runner builds its
# image from Docker Hub before the first step, so a Docker Hub rate limit or
# outage stops the deploy. doctl is one binary from a GitHub release, and the
# checksum below locks it to one build. A bump changes the version and the
# checksum together.
runs:
  using: composite
  steps:
    - shell: bash
      env:
        DOCTL_VERSION: 1.177.0
        DOCTL_SHA256: 34d3954721bfb8cdb42032e78d98274f157426fa6332511ae356edcce59dade3
      run: |
        archive="doctl-${DOCTL_VERSION}-linux-amd64.tar.gz"
        curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/$archive" \
          "https://github.com/digitalocean/doctl/releases/download/v${DOCTL_VERSION}/$archive"
        echo "$DOCTL_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
        mkdir -p "$RUNNER_TEMP/doctl"
        tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/doctl"
        # /usr/local/bin is on the PATH of each later step, so the action
        # writes no file of the runner environment.
        sudo install -m 0755 "$RUNNER_TEMP/doctl/doctl" /usr/local/bin/doctl
        doctl version
