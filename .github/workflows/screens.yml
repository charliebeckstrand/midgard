name: Screens

# Screenshots of the docs site, compared with the last full run on main. The
# weekly Testing routine reads the log of the scheduled run: the log lists each
# changed screenshot. The `screens-diff` artifact holds the base, the current
# screenshot, and the difference of each one, side by side. No pull request or
# push starts this workflow. packages/ui/scripts/screens.ts tells what it
# captures.
on:
  # Each Thursday at 06:17 UTC.
  schedule:
    - cron: '17 6 * * 4'
  workflow_dispatch:
    inputs:
      pages:
        description: Page ids to capture, separated by spaces. Empty means each page.
        required: false
        default: ''
      density:
        description: Density levels to capture, separated by commas, for example loose,snug,compact. Empty means snug.
        required: false
        default: ''

permissions:
  contents: read
  # The base step reads the artifacts of earlier runs.
  actions: read

jobs:
  screens:
    # A fixed image, because a new image can render text in a different way,
    # and each screenshot then changes.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PAGES: ${{ inputs.pages }}
      DENSITY: ${{ inputs.density || 'snug' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # The same browser cache as the `browser` job in ci.yml.
      - id: playwright
        working-directory: packages/ui
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}
      - run: pnpm --filter ui exec playwright install chromium
      - run: pnpm --filter ui screens $PAGES --density=$DENSITY --out=.screens/current
      # A run of each page is a full run, and its screenshots are the artifact
      # `screens-<levels>`. The base is the newest such artifact from main. The
      # upload comes after the comparison, so the base is never this run.
      - id: base
        run: |
          name="screens-${DENSITY//,/-}"
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$name&per_page=50" \
            --jq '[.artifacts[] | select(.expired | not) | select(.workflow_run.head_branch == "main")][0].workflow_run.id // empty')
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "run=$run" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - if: steps.base.outputs.run != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.base.outputs.name }}
          path: packages/ui/.screens/base
          run-id: ${{ steps.base.outputs.run }}
          github-token: ${{ github.token }}
      - if: steps.base.outputs.run != ''
        run: |
          echo "screens: the base is run $BASE_RUN."
          pnpm --filter ui screens:diff .screens/base .screens/current .screens/diff ${PAGES:+--partial}
          cat packages/ui/.screens/diff/report.md >> "$GITHUB_STEP_SUMMARY"
        env:
          BASE_RUN: ${{ steps.base.outputs.run }}
      - if: steps.base.outputs.run == ''
        run: |
          echo "screens: no full run on main has screenshots at $DENSITY, so this run has no base." | tee -a "$GITHUB_STEP_SUMMARY"
      - if: steps.base.outputs.run != ''
        uses: actions/upload-artifact@v7
        with:
          name: screens-diff
          path: packages/ui/.screens/diff
      - if: env.PAGES == ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.base.outputs.name }}
          path: packages/ui/.screens/current
          retention-days: 90
