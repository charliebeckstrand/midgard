name: Density stress

# The Firefox and WebKit instances of the `engines` job of ci.yml, many
# times, on separate runners. In some runs of that job, two Firefox content processes stopped on signal 11 in the
# first seconds, before a file reported. Firefox wrote no cause to its
# stderr. With `isolate: false`, the seed sets the first file of the page. A
# crash that repeats with one seed thus points to a file. A crash that does
# not repeat points to the environment.
#
# No pull request, push, or schedule starts it. Start a run from the Actions
# tab, or with `gh workflow run density-stress.yml -f seed=<seed>`.
on:
  # TEMPORARY: runs on each push of this branch, to measure the crash rate. Remove before merge.
  push:
    branches: [claude/project-thread-8kmt0n]
  workflow_dispatch:
    inputs:
      seed:
        description: The shuffle seed of each run. Leave it empty for a new seed in each run.
        required: false
        default: ''
      runs:
        description: The number of runs, from 1 to 50.
        required: false
        default: '20'

permissions:
  contents: read

jobs:
  # The run numbers of the matrix, and the `playwright` version for the tag
  # of the container image. A job of its own, because `container` and
  # `matrix` resolve before the steps of their job run.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runs: ${{ steps.plan.outputs.runs }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: packages/ui/package.json
          sparse-checkout-cone-mode: false
      - id: plan
        run: |
          case "$RUNS" in
            ''|*[!0-9]*) echo "runs must be a number; received '$RUNS'" >&2; exit 1 ;;
          esac
          if [ "$RUNS" -lt 1 ] || [ "$RUNS" -gt 50 ]; then
            echo "runs must be from 1 to 50; received $RUNS" >&2
            exit 1
          fi
          echo "runs=$(jq -nc --argjson n "$RUNS" '[range(1; $n + 1)]')" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r '.devDependencies.playwright' packages/ui/package.json)" >> "$GITHUB_OUTPUT"
        env:
          RUNS: ${{ inputs.runs || '20' }}

  # The container, the options, and the environment are those of the
  # `engines` job of ci.yml, and the command runs each instance of that job.
  # The two jobs thus run under the same conditions. The Wysiwyg instances in
  # WebKit run too, because they run beside Firefox in `engines`.
  density:
    name: density (run ${{ matrix.run }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.plan.outputs.version }}-resolute
      options: --ipc=host
    strategy:
      # Let each run finish, so that the result gives the crash rate.
      fail-fast: false
      matrix:
        run: ${{ fromJSON(needs.plan.outputs.runs) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The reason is in the `engines` job of ci.yml.
      - run: git config --system --add safe.directory "$GITHUB_WORKSPACE"
      - uses: ./.github/actions/setup
      # Playwright starts this Firefox build with no crash reporter variables,
      # so a crash leaves no dump. This step shows if the build holds a crash
      # reporter that a later change can turn on.
      - name: List the crash reporter files of Firefox
        run: find /ms-playwright -maxdepth 3 -path '*firefox*' \( -iname '*crash*' -o -iname '*minidump*' \) -print | grep . || echo 'The Firefox build holds no crash reporter file.'
      # The CPU and the kernel of the runner. A crash that occurs only on one
      # CPU model points to the hardware, not to the tests.
      - name: Show the CPU and the kernel of the runner
        run: |
          grep -m1 'model name' /proc/cpuinfo
          uname -r
      # Not through turbo: a cache hit would skip the run that this workflow
      # exists for.
      - run: pnpm --filter ui test:browser --project density-firefox --project density-webkit --project wysiwyg-webkit --project wysiwyg-floating-ui-webkit --project wysiwyg-floating-motion-webkit
        env:
          DEBUG: pw:browser
          ALL_ENGINES: 1
          HOME: /root
          VITEST_SEED: ${{ inputs.seed }}
