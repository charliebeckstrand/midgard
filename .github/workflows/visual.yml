name: Visual

# Percy snapshots of the fixture sheets of ui, on demand only. A Percy build
# spends the screenshot quota of the plan, so no schedule, pull request, or push
# starts this workflow. A run of each sheet at the default density is about 10
# sheets, so about 80 screenshots in two browsers. Start a run from the Actions
# tab, or with `gh workflow run visual.yml`.
# packages/ui/scripts/visual.ts tells what it captures.
on:
  workflow_dispatch:
    inputs:
      density:
        description: Density levels to snapshot, separated by commas, for example loose,snug,compact. Empty means snug.
        required: false
        default: ''

permissions:
  contents: read

jobs:
  percy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # The same browser cache as the `browser` job in ci.yml.
      - id: playwright
        working-directory: packages/ui
        run: |
          echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "executable=$(node -p "require('playwright').chromium.executablePath()")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}
      - run: pnpm --filter ui exec playwright install chromium
      # When the secret is not set, the script writes a notice and passes.
      # Percy discovers the assets of each snapshot with the Playwright build
      # of Chromium, so that it does not download a second browser.
      # The log of `percy exec` gives the URL of the build, and the last part of
      # that URL is the id of the build.
      - id: visual
        run: |
          pnpm --filter ui visual ${DENSITY:+--density=$DENSITY} | tee visual.log
          echo "build=$(grep -oE 'percy\.io/[^ ]*/builds/[0-9]+' visual.log | tail -n 1 | grep -oE '[0-9]+$')" >> "$GITHUB_OUTPUT"
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
          PERCY_BROWSER_EXECUTABLE: ${{ steps.playwright.outputs.executable }}
          DENSITY: ${{ inputs.density }}
      # Percy compares the snapshots after the build is finalized. Wait for the
      # comparisons, so that the log gives the number of changes. The log is
      # the only record of the result that a reader without percy.io access
      # can see.
      - if: steps.visual.outputs.build != ''
        run: pnpm --filter ui exec percy build:wait --build "$BUILD"
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
          BUILD: ${{ steps.visual.outputs.build }}
