name: Visual

# Percy snapshots of the docs site, each week and on demand. A Percy build
# spends the screenshot quota of the plan, so no pull request or push starts
# this workflow. The schedule runs each page at the default density, and skips
# a week in which nothing that the docs site renders changed. Start other runs
# from the Actions tab, or with `gh workflow run visual.yml`.
# packages/ui/scripts/visual.ts tells what it captures.
on:
  # Each Thursday at 06:17 UTC. The weekly Testing routine reads this run.
  schedule:
    - cron: '17 6 * * 4'
  workflow_dispatch:
    inputs:
      pages:
        description: Page ids to snapshot, separated by spaces. Empty means each page.
        required: false
        default: ''
      density:
        description: Density levels to snapshot, separated by commas, for example loose,snug,compact. Empty means snug.
        required: false
        default: ''

permissions:
  contents: read

jobs:
  # A scheduled run compares main with the commit of the last scheduled run
  # that passed. When packages/ui and the lockfile did not change, the run takes
  # no snapshots, and the quota is not spent. The skip is safe from week to week:
  # a skipped run passes, but only when its commit renders the same as the last
  # one. A manual run never skips.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.diff.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'schedule'
        with:
          fetch-depth: 0
      - id: diff
        if: github.event_name == 'schedule'
        run: |
          last=$(gh run list --workflow visual.yml --branch main --event schedule --status success --limit 1 --json headSha --jq '.[0].headSha // empty')
          if [ -n "$last" ] && git cat-file -e "$last^{commit}" && git diff --quiet "$last" HEAD -- packages/ui pnpm-lock.yaml; then
            echo "visual: packages/ui and pnpm-lock.yaml did not change since $last, so this run takes no snapshots." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  percy:
    needs: changes
    if: needs.changes.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # The same browser cache as the `browser` job in ci.yml.
      - id: playwright
        working-directory: packages/ui
        run: |
          echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "executable=$(node -p "require('playwright').chromium.executablePath()")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}
      - run: pnpm --filter ui exec playwright install chromium
      # When the secret is not set, the script writes a notice and passes.
      # Percy discovers the assets of each snapshot with the Playwright build
      # of Chromium, so that it does not download a second browser.
      # The log of `percy exec` gives the URL of the build, and the last part of
      # that URL is the id of the build.
      - id: visual
        run: |
          pnpm --filter ui visual $PAGES ${DENSITY:+--density=$DENSITY} | tee visual.log
          echo "build=$(grep -oE 'percy\.io/[^ ]*/builds/[0-9]+' visual.log | tail -n 1 | grep -oE '[0-9]+$')" >> "$GITHUB_OUTPUT"
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
          PERCY_BROWSER_EXECUTABLE: ${{ steps.playwright.outputs.executable }}
          PAGES: ${{ inputs.pages }}
          DENSITY: ${{ inputs.density }}
      # Percy compares the snapshots after the build is finalized. Wait for the
      # comparisons, so that the log gives the number of changes. The log is
      # the only record of the result that a reader without percy.io access
      # can see.
      - if: steps.visual.outputs.build != ''
        run: pnpm --filter ui exec percy build:wait --build "$BUILD"
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
          BUILD: ${{ steps.visual.outputs.build }}
