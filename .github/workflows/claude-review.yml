name: Claude review

# Claude reviews a pull request with anthropics/claude-code-action, and posts
# inline comments and one summary comment. Each run spends usage of the Claude
# plan that the token belongs to. Thus a review starts at two points, not at
# each push:
#
# - A pull request opens as ready, or a draft becomes ready for review.
# - A collaborator writes a comment that starts with `@claude review`.
#
# To review each push too, add `synchronize` to the `pull_request` types.
on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  review:
    # Renovate and Dependabot open pull requests as bots, and the action stops
    # for a bot. The `if` skips those runs, so that no red check shows.
    if: >-
      (github.event_name == 'pull_request'
        && !github.event.pull_request.draft
        && github.event.pull_request.user.type != 'Bot')
      || (github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.issue.state == 'open'
        && startsWith(github.event.comment.body, '@claude review')
        && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The concurrency is on the job, not on the workflow. Each comment on the
    # pull request starts a run, the comments of the review too. A run with
    # concurrency on the workflow would cancel a review in progress, even
    # when its own job is skipped.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      # The action exchanges an OIDC token for a token of the Claude GitHub app.
      id-token: write
    steps:
      # A pull request from a fork gets no secrets. When the secret is not set,
      # the step writes a notice, and the job passes with no review.
      - id: token
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set, so no review runs."
          else
            echo "set=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      # The head of the pull request, not the merge commit, so that the line
      # numbers of the inline comments agree with the diff. A comment event
      # carries no head SHA, so that run checks out the head ref.
      - if: steps.token.outputs.set
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || format('refs/pull/{0}/head', github.event.issue.number) }}
          fetch-depth: 1

      # The action restores `.claude/`, `.mcp.json`, and `CLAUDE.md` from the
      # base branch before Claude starts, so a pull request cannot change the
      # hooks or the instructions of its own review.
      #
      # `--strict-mcp-config` keeps the servers of `.mcp.json` out. The review
      # needs none of them, and each one downloads a package with npx before
      # Claude starts. The inline comment server of the action stays.
      #
      # `--model opus` sets the strongest model. The default model of the
      # action read a pull request in about 20 seconds and found little. Each
      # pull request gets one review, so the higher cost stays bounded.
      #
      # The tools can read the checkout and the pull request, and write
      # comments. They cannot edit a file or run a script of the pull request.
      - if: steps.token.outputs.set
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --strict-mcp-config
            --model opus
            --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

            Review this pull request. The working directory holds its head.

            Read CLAUDE.md, CONVENTIONS.md, and STE.md first. They are the rules of this repository, and a break of a rule is a finding. Also read the README.md of each package or app that the diff touches.

            Get the diff with `gh pr diff` and the title and the description with `gh pr view`. Read a changed file in full when the diff alone does not show the effect of a change.

            Report only a defect that you can name: a bug, a wrong result, an edge case that fails, a security problem, a regression, a changed behavior with no test, or a break of a repository rule. Give each finding the concrete input or state that fails. Do not report what Biome, the type check, or Knip catches. Do not restate the diff, and do not praise.

            Challenge each finding before you post it (CLAUDE.md §1.5). Drop a finding that is only a different way to write the same code, and a finding that you cannot support from the code.

            Post each finding as an inline comment on its line with `mcp__github_inline_comment__create_inline_comment` and `confirmed: true`. Then post one summary comment with `gh pr comment`: the findings, most severe first, one line each. When you find no defect, post one line that says so.
