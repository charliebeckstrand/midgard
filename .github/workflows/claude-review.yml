name: Claude review

# Claude reviews a pull request with anthropics/claude-code-action, and posts
# inline comments and one summary comment. Each run spends usage of the Claude
# plan that the token belongs to. When that plan reaches its usage limit, a
# second token from a different account can do the review (see the review
# steps below). Thus a review starts at two points, not at each push:
#
# - A pull request opens as ready, or a draft becomes ready for review.
# - A collaborator writes a comment that starts with `@claude review`.
#
# To review each push too, add `synchronize` to the `pull_request` types.
on:
  pull_request:
    types: [opened, ready_for_review]
  # zizmor flags `issue_comment` as a dangerous trigger: the run has the
  # secrets of the repository while Claude reads the files of the pull request.
  # The `if` of the job lets only an owner, a member, or a collaborator start
  # it, and the first step stops the review of a pull request from a fork. Thus
  # the secrets meet only text from a branch of this repository, and the
  # trigger stays (decision of 2026-11-16).
  issue_comment: # zizmor: ignore[dangerous-triggers]
    types: [created]

permissions:
  contents: read

jobs:
  review:
    # Renovate and Dependabot open pull requests as bots, and the action stops
    # for a bot. The `if` skips those runs, so that no red check shows.
    if: >-
      (github.event_name == 'pull_request'
        && !github.event.pull_request.draft
        && github.event.pull_request.user.type != 'Bot')
      || (github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.issue.state == 'open'
        && startsWith(github.event.comment.body, '@claude review')
        && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The concurrency is on the job, not on the workflow. Each comment on the
    # pull request starts a run, the comments of the review too. A run with
    # concurrency on the workflow would cancel a review in progress, even
    # when its own job is skipped.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      # The action exchanges an OIDC token for a token of the Claude GitHub app.
      id-token: write
    steps:
      # The review runs only for a pull request from a branch of this
      # repository, and only when one of the two secrets is set. A
      # `pull_request` run from a fork gets no secrets, but an `issue_comment`
      # run gets them for any pull request, so the step reads where the head
      # is. Otherwise the step writes a notice, and the job passes with no
      # review. The `primary` and `fallback` outputs tell the review steps which
      # secrets are set.
      - id: token
        run: |
          fork=$(gh pr view "$PR" --repo "$REPO" --json isCrossRepository --jq .isCrossRepository)
          if [ "$fork" != "false" ]; then
            echo "::notice::The pull request comes from a fork, so no review runs."
          elif [ -z "$PRIMARY" ] && [ -z "$FALLBACK" ]; then
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN and CLAUDE_CODE_OAUTH_TOKEN_FALLBACK are not set, so no review runs."
          else
            echo "set=true" >> "$GITHUB_OUTPUT"
            if [ -n "$PRIMARY" ]; then echo "primary=true" >> "$GITHUB_OUTPUT"; fi
            if [ -n "$FALLBACK" ]; then echo "fallback=true" >> "$GITHUB_OUTPUT"; fi
          fi
        env:
          PRIMARY: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          FALLBACK: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          REPO: ${{ github.repository }}

      # The head of the pull request, not the merge commit, so that the line
      # numbers of the inline comments agree with the diff. A comment event
      # carries no head SHA, so that run checks out the head ref.
      #
      # `persist-credentials: false` keeps the job token out of `.git/config`.
      # Claude reads the files of a pull request that can come from a fork, and
      # the token must not be on the disk that it reads. The action gets its
      # own token for its comments (see `id-token` above).
      - if: steps.token.outputs.set
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || format('refs/pull/{0}/head', github.event.issue.number) }}
          fetch-depth: 1
          persist-credentials: false

      # The action restores `.claude/`, `.mcp.json`, and `CLAUDE.md` from the
      # base branch before Claude starts, so a pull request cannot change the
      # hooks or the instructions of its own review.
      #
      # `--strict-mcp-config` keeps the servers of `.mcp.json` out. The review
      # needs none of them, and each one downloads a package with npx before
      # Claude starts. The inline comment server of the action stays.
      #
      # `--model opus` sets the strongest model. The default model of the
      # action read a pull request in about 20 seconds and found little. Each
      # pull request gets one review, so the higher cost stays bounded.
      #
      # The tools can read the checkout and the pull request, and write
      # comments. They cannot edit a file or run a script of the pull request.
      #
      # A failure of this step does not fail the job. The next step does the
      # review again with the fallback token, and the last step fails the job
      # when no review passed. The usage limit of the plan is the usual cause
      # of a failure.
      #
      # `continue-on-error` is a constant. An expression on the `steps` context
      # had no effect in run 44599245029: both secrets were set, but the
      # failure of this step failed the job, and the runner skipped the
      # fallback step.
      - id: review
        if: steps.token.outputs.primary
        continue-on-error: true
        uses: anthropics/claude-code-action@f431adaf77e0fecf918431e75a2b5b45b85af002 # v1.0.283
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: &review-args >-
            --strict-mcp-config
            --model opus
            --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"
          prompt: &review-prompt |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

            Review this pull request. The working directory holds its head.

            Read CLAUDE.md, CONVENTIONS.md, and STE.md first. They are the rules of this repository, and a break of a rule is a finding. Also read the README.md of each package or app that the diff touches.

            Get the diff with `gh pr diff` and the title and the description with `gh pr view`. Read a changed file in full when the diff alone does not show the effect of a change.

            Report only a defect that you can name: a bug, a wrong result, an edge case that fails, a security problem, a regression, a changed behavior with no test, or a break of a repository rule. Give each finding the concrete input or state that fails. Do not report what Biome, the type check, or Knip catches. Do not restate the diff, and do not praise.

            Challenge each finding before you post it (CLAUDE.md §1.5). Drop a finding that is only a different way to write the same code, and a finding that you cannot support from the code.

            Post each finding as an inline comment on its line with `mcp__github_inline_comment__create_inline_comment` and `confirmed: true`. Then post one summary comment with `gh pr comment`: the findings, most severe first, one line each. When you find no defect, post one line that says so.

      # The review with the token of a second account
      # (`CLAUDE_CODE_OAUTH_TOKEN_FALLBACK`). It runs when the step above fails,
      # or when only the fallback secret is set. The two aliases give it the
      # arguments and the prompt of the step above.
      #
      # This step runs after each failure of the step above, not only after the
      # usage limit. When the step above posted a part of its comments before it
      # failed, this step can post the same findings again.
      - id: fallback
        if: steps.token.outputs.fallback && steps.review.outcome != 'success'
        uses: anthropics/claude-code-action@f431adaf77e0fecf918431e75a2b5b45b85af002 # v1.0.283
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK }}
          claude_args: *review-args
          prompt: *review-prompt

      # The first review step cannot fail the job. Thus this step fails the job
      # when the first review failed and no fallback review passed. A failure
      # of the fallback step fails the job itself, and then this step is
      # skipped.
      - if: >-
          steps.token.outputs.set
          && steps.review.outcome != 'success'
          && steps.fallback.outcome != 'success'
        run: |
          echo "::error::The review failed, and no fallback review passed."
          exit 1
