name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    # The `coverage-upload` job of CI gives the coverage of main to Codecov, as
    # the base for the pull requests. A called workflow gets no secret that its
    # caller does not give.
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  deploy:
    name: Deploy to DigitalOcean
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    # A stuck deploy holds the concurrency group, and the next push waits on it.
    timeout-minutes: 45
    # The `production` step below moves the branch that App Platform builds.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Without a project ID, the action creates the app in the default project
      # of the account. Stop before that happens.
      - name: Check the DigitalOcean project ID
        if: vars.DIGITALOCEAN_PROJECT_ID == ''
        run: |
          echo "::error::Set the DIGITALOCEAN_PROJECT_ID variable to the ID of the Ivory Image project."
          exit 1

      # The digitalocean/app_action action is a Docker action. The runner builds
      # its image from Docker Hub before the first step, so a Docker Hub rate
      # limit or outage stops the deploy. doctl is one binary from a GitHub
      # release, and the checksum below locks it to one build.
      - name: Install doctl
        env:
          DOCTL_VERSION: 1.177.0
          DOCTL_SHA256: 34d3954721bfb8cdb42032e78d98274f157426fa6332511ae356edcce59dade3
        run: |
          archive="doctl-${DOCTL_VERSION}-linux-amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/$archive" \
            "https://github.com/digitalocean/doctl/releases/download/v${DOCTL_VERSION}/$archive"
          echo "$DOCTL_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/doctl"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/doctl"
          echo "$RUNNER_TEMP/doctl" >> "$GITHUB_PATH"

      # Each component of .do/app.yaml builds the newest commit of the
      # `production` branch. This step moves that branch to the commit that CI
      # checked, so App Platform builds that commit and not the head of main.
      # The head of main can be a later commit whose CI has not passed.
      #
      # The update is a fast-forward only (`force=false`), so GitHub refuses a
      # move to a commit that is not a descendant. When `production` already
      # holds a later commit, this run does not deploy, because a later run
      # deployed a newer commit. When it holds this commit, the run deploys
      # again, as a re-run of a failed deploy must.
      - name: Move the production branch to this commit
        id: production
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          if ! current=$(gh api "repos/$REPO/git/ref/heads/production" --jq .object.sha); then
            # No branch yet: the first run creates it. The call fails when the
            # branch exists, so another fault of the call above stops the job.
            gh api "repos/$REPO/git/refs" -f ref=refs/heads/production -f sha="$SHA" > /dev/null
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          status=$(gh api "repos/$REPO/compare/$current...$SHA" --jq .status)
          case "$status" in
            identical) ;;
            ahead)
              gh api --method PATCH "repos/$REPO/git/refs/heads/production" -f sha="$SHA" -F force=false > /dev/null
              ;;
            behind)
              echo "::notice::production holds $current, a later commit than $SHA. This run does not deploy."
              exit 0
              ;;
            *)
              echo "::error::production holds $current, which is not an ancestor of $SHA (compare status: $status)."
              exit 1
              ;;
          esac
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      # Creates the app from .do/app.yaml on the first run, in the Ivory Image
      # project, then updates it from the latest source and waits for the
      # deployment to go live. doctl reads `--project-id` only when it creates
      # the app. The step puts the secret into a copy of the spec, because
      # doctl does not expand variables in the spec.
      - name: Deploy to App Platform
        if: steps.production.outputs.deploy
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          CLIENT_IP_SECRET: ${{ secrets.CLIENT_IP_SECRET }}
          PROJECT_ID: ${{ vars.DIGITALOCEAN_PROJECT_ID }}
        run: |
          spec="$RUNNER_TEMP/app.yaml"
          envsubst "\${CLIENT_IP_SECRET}" < .do/app.yaml > "$spec"

          app=$(doctl apps create --spec "$spec" --upsert --update-sources \
            --project-id "$PROJECT_ID" --format ID --no-header)

          # The latest deployment is the one that the update started.
          deployment=$(doctl apps list-deployments "$app" --format ID --no-header | sed -n 1p)
          echo "App $app, deployment $deployment"

          # The job timeout stops a deployment that does not end.
          last=""
          while :; do
            phase=$(doctl apps get-deployment "$app" "$deployment" --format Phase --no-header)
            if [ "$phase" != "$last" ]; then
              echo "Phase: $phase"
              last="$phase"
            fi
            case "$phase" in
              ACTIVE | ERROR | CANCELED | SUPERSEDED) break ;;
            esac
            sleep 10
          done

          for type in build deploy; do
            echo "::group::$type logs"
            doctl apps logs "$app" --deployment "$deployment" --type "$type" || true
            echo "::endgroup::"
          done

          if [ "$phase" != ACTIVE ]; then
            echo "::error::The deployment ended in phase $phase."
            exit 1
          fi
