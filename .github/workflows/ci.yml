name: CI

on:
  pull_request:
  # Pushes to main run CI through the deploy workflow (deploy.yml).
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# The jobs read the repository and nothing else.
permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/turbo-cache
        with:
          name: gate
      # One Biome run over the whole repository, not the `lint` task of each
      # package. The package tasks miss the files at the root, such as
      # turbo.json and knip.json. `biome ci` also writes its findings as
      # annotations on the pull request.
      - run: pnpm biome ci .
      # The tests run in the `test` job below, the builds in the `build` job,
      # and the docs build and its budget in the `browser` job.
      - run: pnpm turbo run check-types knip --summarize
      - name: Prune the Turbo cache to this run's tasks
        run: .github/actions/turbo-cache/prune.sh

  # A separate job, not a step in `gate`. The two Next builds shared the four
  # cores of `gate` with the type-check and the docs build, and each slowed the
  # others. `docs:build` took many times longer in `gate` than alone.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/turbo-cache
        with:
          name: build
      # The Turbopack build cache of each app. `next build` writes it under
      # .next/cache, and the turbo outputs of `build` leave that directory out.
      # With the cache, a build of the same source, or of a source with an edit
      # to a ui component, takes a fraction of the time of a cold build. The
      # cache holds entries of the installed packages of the apps, so the key stops at
      # the hash of those packages, not at the source. The SHA makes each run
      # save what it wrote for the next run to restore.
      #
      # The key was the hash of the whole lockfile. A pull request can restore
      # only what main saved, and main saves the cache of an app only when it
      # builds that app. Turbo replays an app that did not change, so after a
      # lockfile change main had no entry for the new key, and every pull
      # request built each app cold. Turbo hashes the packages that each app
      # resolves (`hashOfExternalDependencies`), so a lockfile change for one
      # package keeps the key of the others.
      - id: next-deps
        run: |
          hash=$(pnpm turbo run build --filter=admin --filter=picks --filter=places --dry=json \
            | jq -er '[.tasks[] | select(.taskId | test("^(admin|picks|places)#build$")) | .hashOfExternalDependencies] | if length == 3 then sort | join("-") else error("missing app") end')
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: apps/*/.next/cache
          key: ${{ runner.os }}-next-cache-${{ steps.next-deps.outputs.hash }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-next-cache-${{ steps.next-deps.outputs.hash }}-
      # A restored Turbopack cache can hold a bad entry. Then each build that
      # restores it fails with the same error, for example "Module not found"
      # for a file that exists. Each run restores the cache of an earlier run,
      # so the bad entry does not go. Thus a failed build runs one more time
      # with no cache before the step fails. When that build passes, the run
      # saves a clean cache for the next runs.
      - run: |
          pnpm turbo run build --summarize || {
            echo "::warning::The build failed with the restored Next cache. It runs again with no cache."
            rm -rf apps/*/.next/cache
            pnpm turbo run build --summarize
          }
        env:
          # Placeholder: only used to construct rewrite/fetch URLs, not reached at build time.
          BIFROST_URL: https://bifrost.invalid
      - name: Prune the Turbo cache to this run's tasks
        run: .github/actions/turbo-cache/prune.sh

  # A separate job, not a step in `gate`. In `gate` the ui suite shared four
  # cores with the type-check and the Next builds, and it took more than twice
  # as long as alone. Each shard runs half of the ui test files, so each pull
  # request still runs each test.
  test:
    name: test (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Let the other shard finish, so that one run shows each failure.
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/turbo-cache
        with:
          name: test-${{ matrix.shard }}
      # Vitest's disk module cache (vitest.config.ts, `experimental.fsModuleCache`).
      # Vitest writes it under the workspace root's node_modules, not the
      # package's. Restored after install so the directory lands inside a
      # populated node_modules.
      #
      # Entries hold absolute paths into the pnpm virtual store, and the cache
      # carries no marker of the tree that wrote it, so a cache from one
      # dependency tree is wrong for every other. A prefix restore key across
      # lockfiles handed a vitest 4.1.10 cache to a 4.1.11 run, and all 500
      # test files failed to import `vitest`. The restore key below therefore
      # stops at the hash of the packages that ui resolves, which turbo gives
      # as `hashOfExternalDependencies`.
      #
      # The key was the hash of the whole lockfile. A pull request can restore
      # only what main saved, and main saves only when it runs the ui suite.
      # After a lockfile change for another package, turbo replayed the ui
      # suite on main, so main saved nothing under the new key, and each pull
      # request ran the suite cold.
      #
      # Vitest hashes the text of every file `vitest.config.ts` imports into
      # each entry's key, and the config imports the docs plugin. An edit to
      # any of them makes every entry miss. The key was the lockfile alone,
      # and actions/cache does not save on an exact hit, so the cache froze at
      # the first run after a lockfile change. The next edit to an imported
      # file made it useless, and each run transformed the suite cold.
      # The second hash starts a new cache when those files change, and the
      # SHA makes each run save what it wrote for the next run to restore.
      # Each shard transforms a different half of the suite, so each shard
      # keeps its own cache.
      - id: ui-deps
        run: |
          hash=$(pnpm turbo run test --filter=ui --dry=json \
            | jq -er '.tasks[] | select(.taskId == "ui#test") | .hashOfExternalDependencies')
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: node_modules/.experimental-vitest-cache
          key: ${{ runner.os }}-vitest-cache-${{ matrix.shard }}-${{ steps.ui-deps.outputs.hash }}-${{ hashFiles('packages/ui/vitest.config.ts', 'packages/ui/src/__tests__/helpers/walk-source.ts', 'packages/ui/src/docs/plugin/**/*.ts') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-vitest-cache-${{ matrix.shard }}-${{ steps.ui-deps.outputs.hash }}-${{ hashFiles('packages/ui/vitest.config.ts', 'packages/ui/src/__tests__/helpers/walk-source.ts', 'packages/ui/src/docs/plugin/**/*.ts') }}-
      - run: pnpm turbo run test --filter=ui --summarize -- --shard=${{ matrix.shard }}/2
      # The other packages have few test files, and a shard of them can be
      # empty. The second shard runs them whole, with `test:workspace` below,
      # because its half of the ui suite is the shorter half.
      - if: matrix.shard == 2
        run: pnpm turbo run test --filter='!ui' --summarize
      # The ui suites that read files outside ui, apart from `test` so that an
      # edit outside ui keeps the cache of the ui suite (packages/ui/turbo.json).
      - if: matrix.shard == 2
        run: pnpm turbo run test:workspace --filter=ui --summarize
      - name: Prune the Turbo cache to this run's tasks
        run: .github/actions/turbo-cache/prune.sh

  # A separate job, not a step in `gate`: the browser suite needs a Chromium
  # download that would otherwise serialize into every gate run. What it covers
  # is CONVENTIONS.md §10.5.
  #
  # Two shards, each with half of the test files, as in `compiler`. Before, one
  # job ran the whole suite beside `docs:build` (the `docs` job now). Each half
  # pays the start of the browser and of its six Chromium instances again, and
  # that start is a large part of a half. So a third shard gives less back than
  # the second.
  browser:
    name: browser (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Let the other shard finish, so that one run shows each failure.
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/turbo-cache
        with:
          name: browser-${{ matrix.shard }}
      - uses: ./.github/actions/playwright
      # Filtered to `ui`, as in `compiler`.
      - run: pnpm turbo run test:browser --filter=ui --summarize -- --shard=${{ matrix.shard }}/2
      - name: Prune the Turbo cache to this run's tasks
        run: .github/actions/turbo-cache/prune.sh

  # The `playwright` version that packages/ui pins, for the tag of the
  # container image of `density`. One statement of the version means that the
  # image and the npm package cannot drift: a bump of `playwright` changes the
  # image in the same commit. A job of its own, because `container` resolves
  # before the steps of its job run.
  playwright-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: packages/ui/package.json
          sparse-checkout-cone-mode: false
      - id: version
        run: echo "version=$(jq -r '.devDependencies.playwright' packages/ui/package.json)" >> "$GITHUB_OUTPUT"

  # The density files of the browser suite in Firefox and WebKit, the
  # `density-firefox` and `density-webkit` instances of
  # packages/ui/vitest.browser.config.ts. A separate job, not a matrix entry
  # of `browser`: only this job runs the two browsers. The two instances hold
  # a few files, so one job runs them with no shard. `DENSITY_ENGINES` adds
  # the two instances, and `--project` runs only them, so the Chromium
  # instances stay in `browser`.
  #
  # The job runs in the Playwright image, which holds Firefox, WebKit, and
  # each system package that they load. `playwright install --with-deps` ran
  # apt for about 185 packages and 140 MB. A slow Ubuntu mirror stalled it,
  # and the job hung until its time limit on several pull requests. In the
  # image, the job downloads no browser and runs no apt. The tag must match
  # the `playwright` package, or the browsers in the image do not launch, so
  # `playwright-version` supplies it. `resolute` is the Ubuntu of
  # `ubuntu-latest`.
  density:
    needs: playwright-version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-resolute
    steps:
      - uses: actions/checkout@v7
      # The workspace belongs to the runner user, and the container runs as
      # root, so git refuses the repository that Turbo reads. checkout trusts
      # the workspace only for its own step.
      - run: git config --system --add safe.directory "$GITHUB_WORKSPACE"
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/turbo-cache
        with:
          name: density
      # Filtered to `ui`, as in `browser`. The container runs as root, and
      # Firefox does not start as root when HOME belongs to another user.
      # GitHub sets HOME to a directory of the runner user.
      - run: pnpm turbo run test:browser --filter=ui --summarize -- --project density-firefox --project density-webkit
        env:
          DENSITY_ENGINES: 1
          HOME: /root
      - name: Prune the Turbo cache to this run's tasks
        run: .github/actions/turbo-cache/prune.sh

  # A separate job, not a step in `browser`. In `browser`, `docs:build` took
  # about twice as long beside the browser suite as alone, and it slowed the
  # suite too.
  # `test:docs-build` loads prerendered pages of the docs app in Chromium, and
  # measures the bundle of the docs build (packages/ui/src/__tests__/docs-build/).
  # It depends on `docs:build`, so each shard builds the app one time.
  #
  # Three shards. The axe file reads each page in Chromium and holds most of
  # the time of the suite, so each shard reads a third of the pages, and the
  # shards divide the other files (vitest.docs-build.config.ts). Each shard
  # pays the setup and the build again. With two shards, the docs job was the
  # longest job of the run.
  docs:
    name: docs (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Let the other shards finish, so that one run shows each failure.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/turbo-cache
        with:
          name: docs-${{ matrix.shard }}
      - uses: ./.github/actions/playwright
      - run: pnpm turbo run test:docs-build --filter=ui --summarize -- --shard=${{ matrix.shard }}/3
      - name: Prune the Turbo cache to this run's tasks
        run: .github/actions/turbo-cache/prune.sh

  # A separate job, not a step in `gate`: the compiled run repeats the ui suite.
  # On the gate's four cores it ran beside the plain suite, the type-check, and
  # the build, and it outlasted them all. `test:compiler` runs the ui tests with
  # the React Compiler on; see packages/ui/vitest.compiler.config.ts and
  # CONVENTIONS.md §10.7.
  #
  # Two shards, each with half of the test files. Each shard runs the skip
  # gate, which compiles the part of the source for that shard
  # (vitest.compiler.config.ts). In one shard, the gate held a large part of
  # that shard.
  compiler:
    name: compiler (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Let the other shard finish, so that one run shows each failure.
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/turbo-cache
        with:
          name: compiler-${{ matrix.shard }}
      # The compiled run's own module cache (vitest.compiler.config.ts), apart
      # from the plain run's cache in `test`. The keys follow the cache of
      # `test`, for the reasons given there, and add the compiler config. Each
      # shard transforms a different half of the suite, so each shard keeps its
      # own cache.
      - id: ui-deps
        run: |
          hash=$(pnpm turbo run test:compiler --filter=ui --dry=json \
            | jq -er '.tasks[] | select(.taskId == "ui#test:compiler") | .hashOfExternalDependencies')
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: node_modules/.experimental-vitest-cache-compiler-*
          key: ${{ runner.os }}-vitest-compiler-cache-${{ matrix.shard }}-${{ steps.ui-deps.outputs.hash }}-${{ hashFiles('packages/ui/vitest.config.ts', 'packages/ui/vitest.compiler.config.ts', 'packages/ui/src/__tests__/helpers/walk-source.ts', 'packages/ui/src/docs/plugin/**/*.ts') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-vitest-compiler-cache-${{ matrix.shard }}-${{ steps.ui-deps.outputs.hash }}-${{ hashFiles('packages/ui/vitest.config.ts', 'packages/ui/vitest.compiler.config.ts', 'packages/ui/src/__tests__/helpers/walk-source.ts', 'packages/ui/src/docs/plugin/**/*.ts') }}-
      # Filtered to `ui`, the one package with the task. Unfiltered, turbo runs
      # the `^build` of each package without it, and builds for nothing.
      - run: pnpm turbo run test:compiler --filter=ui --summarize -- --shard=${{ matrix.shard }}/2
      - name: Prune the Turbo cache to this run's tasks
        run: .github/actions/turbo-cache/prune.sh

  # The one check that branch protection requires, with `commitlint` from the
  # `PR title` workflow. A required check has to match the name of a job, and a
  # change to a job name or to a matrix leaves a required check that never
  # reports. This job keeps its name when the other jobs change.
  #
  # Add each new job to `needs`. The job runs when a needed job fails, and then
  # it fails. A needed job that fails, is cancelled, or is skipped makes it fail.
  ci-ok:
    needs: [gate, build, test, browser, playwright-version, density, docs, compiler]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "$RESULTS"
          exit 1
        env:
          RESULTS: ${{ toJSON(needs) }}
