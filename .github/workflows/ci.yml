name: CI

on:
  pull_request:
  # Pushes to main run CI through the deploy workflow (deploy.yml).
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# The jobs read the repository and nothing else.
permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/turbo-cache
        with:
          name: gate
      # One Biome run over the whole repository, not the `lint` task of each
      # package. The package tasks miss the files at the root, such as
      # turbo.json and knip.json. `biome ci` also writes its findings as
      # annotations on the pull request.
      - run: pnpm biome ci .
      # The tests run in the `test` job below, the builds in the `build` job,
      # and the docs build and its budget in the `browser` job.
      - run: pnpm turbo run check-types knip --summarize
      - name: Prune the Turbo cache to this run's tasks
        run: .github/actions/turbo-cache/prune.sh

  # A separate job, not a step in `gate`. The two Next builds shared the four
  # cores of `gate` with the type-check and the docs build, and the turbo step
  # took 112s. `docs:build` took 9s alone and 75s in `gate`.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/turbo-cache
        with:
          name: build
      # The Turbopack build cache of each app. `next build` writes it under
      # .next/cache, and the turbo outputs of `build` leave that directory out.
      # A cold admin build took 89s. With the cache, a build of the same source
      # took 9s, and a build after an edit to a ui component took 21s. The cache
      # holds entries of the installed Next, so the key stops at the lockfile
      # hash, as the Next documentation gives it. The SHA makes each run save
      # what it wrote for the next run to restore.
      - uses: actions/cache@v6
        with:
          path: apps/*/.next/cache
          key: ${{ runner.os }}-next-cache-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-next-cache-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm turbo run build --summarize
        env:
          # Placeholder: only used to construct rewrite/fetch URLs, not reached at build time.
          BIFROST_URL: https://bifrost.invalid
      - name: Prune the Turbo cache to this run's tasks
        run: .github/actions/turbo-cache/prune.sh

  # A separate job, not a step in `gate`. In `gate` the ui suite shared four
  # cores with the type-check and the Next builds, and it took 158s. Alone on a
  # four-core container it took 71s, and each half of it took about 36s. Each
  # shard runs half of the ui test files, so each pull request still runs each
  # test.
  test:
    name: test (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Let the other shard finish, so that one run shows each failure.
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/turbo-cache
        with:
          name: test-${{ matrix.shard }}
      # Vitest's disk module cache (vitest.config.ts, `experimental.fsModuleCache`).
      # Vitest writes it under the workspace root's node_modules, not the
      # package's. Restored after install so the directory lands inside a
      # populated node_modules.
      #
      # Entries hold absolute paths into the pnpm virtual store, and the cache
      # carries no marker of the tree that wrote it, so a cache from one
      # dependency tree is wrong for every other. A prefix restore key across
      # lockfiles handed a vitest 4.1.10 cache to a 4.1.11 run, and all 500
      # test files failed to import `vitest`. The restore key below therefore
      # stops at the lockfile hash.
      #
      # Vitest hashes the text of every file `vitest.config.ts` imports into
      # each entry's key, and the config imports the docs plugin. An edit to
      # any of them makes every entry miss. The key was the lockfile alone,
      # and actions/cache does not save on an exact hit, so the cache froze at
      # the first run after a lockfile change. The next edit to an imported
      # file made it useless, and each run transformed the suite cold.
      # The second hash starts a new cache when those files change, and the
      # SHA makes each run save what it wrote for the next run to restore.
      # Each shard transforms a different half of the suite, so each shard
      # keeps its own cache.
      - uses: actions/cache@v6
        with:
          path: node_modules/.experimental-vitest-cache
          key: ${{ runner.os }}-vitest-cache-${{ matrix.shard }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('packages/ui/vitest.config.ts', 'packages/ui/src/__tests__/helpers/walk-source.ts', 'packages/ui/src/docs/plugin/**/*.ts') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-vitest-cache-${{ matrix.shard }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('packages/ui/vitest.config.ts', 'packages/ui/src/__tests__/helpers/walk-source.ts', 'packages/ui/src/docs/plugin/**/*.ts') }}-
      - run: pnpm turbo run test --filter=ui --summarize -- --shard=${{ matrix.shard }}/2
      # The other packages have few test files, and a shard of them can be
      # empty. The first shard runs them whole.
      - if: matrix.shard == 1
        run: pnpm turbo run test --filter='!ui' --summarize
      # The ui suites that read files outside ui, apart from `test` so that an
      # edit outside ui keeps the cache of the ui suite (packages/ui/turbo.json).
      - if: matrix.shard == 1
        run: pnpm turbo run test:workspace --filter=ui --summarize
      - name: Prune the Turbo cache to this run's tasks
        run: .github/actions/turbo-cache/prune.sh

  # A separate job, not a step in `gate`: the browser suite needs a Chromium
  # download that would otherwise serialize into every gate run. What it covers
  # is CONVENTIONS.md §10.5.
  #
  # Two shards, each with half of the test files, as in `compiler`. Before, one
  # job ran the whole suite beside `docs:build` (the `docs` job now), and the
  # turbo step took about 2m20s. On a four-core container the suite took about
  # 104s whole, and its halves took about 70s each. Each half pays the start of
  # the browser and of its five instances again, about 35s, so a third shard
  # gives less back than the second.
  browser:
    name: browser (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Let the other shard finish, so that one run shows each failure.
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/turbo-cache
        with:
          name: browser-${{ matrix.shard }}
      # Chromium only: vitest.browser.config.ts declares no other browser. The
      # download is ~170MB, so key it on the one input that decides the browser
      # build: the resolved `playwright` version, which `pnpm install` above has
      # already put on disk. A lockfile hash missed on every dependency bump,
      # and `rangeStrategy: update-lockfile` makes each bot pull request one.
      # No restore key: a prefix match would hand back a superseded revision
      # that `install` then downloads alongside, so the cache would carry both.
      # `install` is idempotent — on a hit it skips the download.
      - id: playwright
        working-directory: packages/ui
        run: |
          echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}
      # The browser alone, with no system packages. The runner image already
      # holds each library that headless Chromium loads. `--with-deps` ran apt
      # on each run, and apt fetched about 35 MB from the Ubuntu mirrors: newer
      # builds of ten of those libraries, and the font packages. A slow mirror
      # stalled the step. One run hung for 15 minutes, and one took 6m41s. The
      # browser suite passes without those fonts. If a runner image drops a
      # library, Chromium does not launch, and the error names the library.
      # Put `--with-deps` back then.
      - run: pnpm --filter ui exec playwright install chromium
      # Filtered to `ui`, as in `compiler`.
      - run: pnpm turbo run test:browser --filter=ui --summarize -- --shard=${{ matrix.shard }}/2
      - name: Prune the Turbo cache to this run's tasks
        run: .github/actions/turbo-cache/prune.sh

  # A separate job, not a step in `browser`. On a four-core container
  # `docs:build` took 36s to 78s alone. In `browser` it took 105s to 130s beside
  # the browser suite, and it slowed the suite too.
  # `test:docs-build` loads prerendered pages of the docs app in Chromium, and
  # measures the bundle of the docs build (packages/ui/src/__tests__/docs-build/).
  # It depends on `docs:build`, so this job builds the app one time.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/turbo-cache
        with:
          name: docs
      # The cache and the install of Chromium that the `browser` job uses, for
      # the same reasons.
      - id: playwright
        working-directory: packages/ui
        run: |
          echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}
      - run: pnpm --filter ui exec playwright install chromium
      - run: pnpm turbo run test:docs-build --filter=ui --summarize
      - name: Prune the Turbo cache to this run's tasks
        run: .github/actions/turbo-cache/prune.sh

  # A separate job, not a step in `gate`: the compiled run repeats the ui suite.
  # On the gate's four cores it ran beside the plain suite, the type-check, and
  # the build, and it outlasted them all. `test:compiler` runs the ui tests with
  # the React Compiler on; see packages/ui/vitest.compiler.config.ts and
  # CONVENTIONS.md §10.7.
  #
  # Two shards, each with half of the test files. The step took about 2m20s
  # whole on warm caches. On a four-core container the run took 67s whole, and
  # its halves took 46s and 34s.
  compiler:
    name: compiler (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Let the other shard finish, so that one run shows each failure.
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/turbo-cache
        with:
          name: compiler-${{ matrix.shard }}
      # The compiled run's own module cache (vitest.compiler.config.ts), apart
      # from the plain run's cache in `gate`. The keys follow the gate's cache,
      # for the reasons given there, and add the compiler config. Each shard
      # transforms a different half of the suite, so each shard keeps its own
      # cache.
      - uses: actions/cache@v6
        with:
          path: node_modules/.experimental-vitest-cache-compiler-*
          key: ${{ runner.os }}-vitest-compiler-cache-${{ matrix.shard }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('packages/ui/vitest.config.ts', 'packages/ui/vitest.compiler.config.ts', 'packages/ui/src/__tests__/helpers/walk-source.ts', 'packages/ui/src/docs/plugin/**/*.ts') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-vitest-compiler-cache-${{ matrix.shard }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('packages/ui/vitest.config.ts', 'packages/ui/vitest.compiler.config.ts', 'packages/ui/src/__tests__/helpers/walk-source.ts', 'packages/ui/src/docs/plugin/**/*.ts') }}-
      # Filtered to `ui`, the one package with the task. Unfiltered, turbo runs
      # the `^build` of each package without it, and builds for nothing.
      - run: pnpm turbo run test:compiler --filter=ui --summarize -- --shard=${{ matrix.shard }}/2
      - name: Prune the Turbo cache to this run's tasks
        run: .github/actions/turbo-cache/prune.sh

  # The one check that branch protection requires, with `commitlint` from the
  # `PR title` workflow. A required check has to match the name of a job, and a
  # change to a job name or to a matrix leaves a required check that never
  # reports. This job keeps its name when the other jobs change.
  #
  # Add each new job to `needs`. The job runs when a needed job fails, and then
  # it fails. A needed job that fails, is cancelled, or is skipped makes it fail.
  ci-ok:
    needs: [gate, build, test, browser, docs, compiler]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "$RESULTS"
          exit 1
        env:
          RESULTS: ${{ toJSON(needs) }}
