name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-gate-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-gate-
      - run: pnpm install --frozen-lockfile
      # `bundle:budget` depends on `docs:build` in turbo.json, so the graph
      # orders them; see bundle-budget.ts for what it asserts and why.
      - run: pnpm turbo run lint check-types test knip build bundle:budget
        env:
          # Placeholder: only used to construct rewrite/fetch URLs, not reached at build time.
          BIFROST_URL: https://bifrost.invalid

  # The browser suite is a separate job, not a step in `gate`: it needs a
  # Chromium download that the jsdom gate does not, and that provisioning would
  # otherwise serialize into every gate run. It asserts what jsdom cannot see —
  # layout, computed colour, target size, and real focus traps — which
  # CONVENTIONS.md §10.5 routes here rather than into the jsdom suite.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: .turbo
          # Disjoint from `gate`'s namespace, not nested under it. A restore key
          # matches by prefix, so a plain `turbo-` prefix on either job would
          # match the other job's entries and hand it a `.turbo` holding the
          # wrong task's artifacts. The two share nothing worth pooling: `ui`
          # declares no workspace dependency, so `^build` resolves to an empty
          # task set here.
          key: ${{ runner.os }}-turbo-browser-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-browser-
      - run: pnpm install --frozen-lockfile
      # Chromium only: vitest.browser.config.ts declares no other browser. The
      # download is ~170MB and playwright is pinned exactly, so cache it against
      # the lockfile and reinstall only the system libraries on a hit.
      - uses: actions/cache@v4
        id: playwright
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.playwright.outputs.cache-hit != 'true'
        run: pnpm --filter ui exec playwright install --with-deps chromium
      - if: steps.playwright.outputs.cache-hit == 'true'
        run: pnpm --filter ui exec playwright install-deps chromium
      - run: pnpm turbo run test:browser
