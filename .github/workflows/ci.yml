name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint check-types test knip build docs:build
        env:
          # Placeholder: only used to construct rewrite/fetch URLs, not reached at build time.
          BIFROST_URL: https://bifrost.invalid
      # The docs bundle is otherwise unmeasured: nothing else in the gate fails
      # when a stray eager import doubles the entry chunk. Asserts a ceiling on
      # total gzip and on the eager entry, the two numbers a regression moves.
      - run: pnpm --filter ui bundle:budget
