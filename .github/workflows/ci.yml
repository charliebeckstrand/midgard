name: CI

on:
  pull_request:
  # Pushes to main run CI through the deploy workflow (deploy.yml).
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-gate-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-gate-
      # Vitest's disk module cache (vitest.config.ts, `experimental.fsModuleCache`).
      # Vitest writes it under the workspace root's node_modules, not the
      # package's. Restored after install so the directory lands inside a
      # populated node_modules.
      #
      # Entries hold absolute paths into the pnpm virtual store, and the cache
      # carries no marker of the tree that wrote it, so a cache from one
      # dependency tree is wrong for every other. A prefix restore key across
      # lockfiles handed a vitest 4.1.10 cache to a 4.1.11 run, and all 500
      # test files failed to import `vitest`. The restore key below therefore
      # stops at the lockfile hash.
      #
      # Vitest hashes the text of every file `vitest.config.ts` imports into
      # each entry's key, and the config imports the docs engine plugins. An
      # edit to any of them makes every entry miss. The key was the lockfile
      # alone, and actions/cache does not save on an exact hit, so the cache
      # froze at the first run after a lockfile change. The next edit to the
      # docs engine made it useless, and each run transformed the suite cold.
      # The second hash starts a new cache when those files change, and the
      # SHA makes each run save what it wrote for the next run to restore.
      - uses: actions/cache@v6
        with:
          path: node_modules/.experimental-vitest-cache
          key: ${{ runner.os }}-vitest-cache-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('packages/ui/vitest.config.ts', 'packages/ui/src/__tests__/helpers/walk-source.ts', 'packages/ui/src/docs/engine/**/*.ts', '!packages/ui/src/docs/engine/**/__tests__/**') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-vitest-cache-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('packages/ui/vitest.config.ts', 'packages/ui/src/__tests__/helpers/walk-source.ts', 'packages/ui/src/docs/engine/**/*.ts', '!packages/ui/src/docs/engine/**/__tests__/**') }}-
      # `bundle:budget` depends on `docs:build` in turbo.json, so the graph
      # orders them; see bundle-budget.ts for what it asserts and why.
      # One Biome run over the whole repository, not the `lint` task of each
      # package. The package tasks miss the files at the root, such as
      # turbo.json and knip.json. `biome ci` also writes its findings as
      # annotations on the pull request.
      - run: pnpm biome ci .
      - run: pnpm turbo run check-types test knip build bundle:budget --summarize
        env:
          # Placeholder: only used to construct rewrite/fetch URLs, not reached at build time.
          BIFROST_URL: https://bifrost.invalid
      # Turbo never evicts from its local cache, and the restore key above
      # carries every entry forward, so each run saved all the entries before
      # it plus its own. It reached 1.4 GB, which the job downloads and
      # uploads each run. Keep only the entries this run hit or wrote: those
      # are the ones the next run can hit. The run summary names their hashes.
      - name: Prune the Turbo cache to this run's tasks
        run: |
          keep=$(jq -r '.tasks[].hash' .turbo/runs/*.json | sort -u)
          for entry in .turbo/cache/*; do
            hash=$(basename "$entry")
            hash=${hash%%[-.]*}
            grep -qxF "$hash" <<< "$keep" || rm -f "$entry"
          done
          rm -rf .turbo/runs
          du -sh .turbo/cache

  # A separate job, not a step in `gate`: the browser suite needs a Chromium
  # download that would otherwise serialize into every gate run. What it covers
  # is CONVENTIONS.md §10.5.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/cache@v6
        with:
          path: .turbo
          # Namespaced per job. A restore key matches by prefix, so a shared
          # `turbo-` prefix hands one job the other job's artifacts.
          key: ${{ runner.os }}-turbo-browser-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-browser-
      # Chromium only: vitest.browser.config.ts declares no other browser. The
      # download is ~170MB, so key it on the one input that decides the browser
      # build: the resolved `playwright` version, which `pnpm install` above has
      # already put on disk. A lockfile hash missed on every dependency bump,
      # and `rangeStrategy: update-lockfile` makes each bot pull request one.
      # No restore key: a prefix match would hand back a superseded revision
      # that `install` then downloads alongside, so the cache would carry both.
      # `install` is idempotent — on a hit it skips the download and installs
      # the system libraries alone.
      - id: playwright
        working-directory: packages/ui
        run: |
          echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}
      - run: pnpm --filter ui exec playwright install --with-deps chromium
      - run: pnpm turbo run test:browser

  # A separate job, not a step in `gate`: the compiled run repeats the ui suite.
  # On the gate's four cores it ran beside the plain suite, the type-check, and
  # the build, and it outlasted them all. `test:compiler` runs the ui tests with
  # the React Compiler on; see packages/ui/vitest.compiler.config.ts and
  # CONVENTIONS.md §10.7.
  #
  # Two shards, each with half of the test files. The step took about 2m20s
  # whole on warm caches. On a four-core container the run took 67s whole, and
  # its halves took 46s and 34s.
  compiler:
    name: compiler (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Let the other shard finish, so that one run shows each failure.
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/cache@v6
        with:
          path: .turbo
          # Namespaced per job and per shard, as in `browser`. Turbo hashes the
          # `--shard` argument into the task, so a shard can hit only its own
          # entries.
          key: ${{ runner.os }}-turbo-compiler-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-compiler-${{ matrix.shard }}-
      # The compiled run's own module cache (vitest.compiler.config.ts), apart
      # from the plain run's cache in `gate`. The keys follow the gate's cache,
      # for the reasons given there, and add the compiler config. Each shard
      # transforms a different half of the suite, so each shard keeps its own
      # cache.
      - uses: actions/cache@v6
        with:
          path: node_modules/.experimental-vitest-cache-compiler-*
          key: ${{ runner.os }}-vitest-compiler-cache-${{ matrix.shard }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('packages/ui/vitest.config.ts', 'packages/ui/vitest.compiler.config.ts', 'packages/ui/src/__tests__/helpers/walk-source.ts', 'packages/ui/src/docs/engine/**/*.ts', '!packages/ui/src/docs/engine/**/__tests__/**') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-vitest-compiler-cache-${{ matrix.shard }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('packages/ui/vitest.config.ts', 'packages/ui/vitest.compiler.config.ts', 'packages/ui/src/__tests__/helpers/walk-source.ts', 'packages/ui/src/docs/engine/**/*.ts', '!packages/ui/src/docs/engine/**/__tests__/**') }}-
      # Filtered to `ui`, the one package with the task. Unfiltered, turbo runs
      # the `^build` of each package without it, and builds for nothing.
      - run: pnpm turbo run test:compiler --filter=ui --summarize -- --shard=${{ matrix.shard }}/2
      # The same pruning as in `gate`, for the same reason.
      - name: Prune the Turbo cache to this run's tasks
        run: |
          keep=$(jq -r '.tasks[].hash' .turbo/runs/*.json | sort -u)
          for entry in .turbo/cache/*; do
            hash=$(basename "$entry")
            hash=${hash%%[-.]*}
            grep -qxF "$hash" <<< "$keep" || rm -f "$entry"
          done
          rm -rf .turbo/runs
          du -sh .turbo/cache
