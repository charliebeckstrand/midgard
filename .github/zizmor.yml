# The configuration of zizmor (.github/workflows/workflow-lint.yml).
rules:
  unpinned-uses:
    # An action of `actions/` can use a major tag, because GitHub owns those
    # repositories. Each other action must use a commit SHA. A tag moves on
    # each release, so a new or a changed release of a third-party action runs
    # at once. A SHA changes only through a Dependabot pull request, which
    # waits for the cooldown in .github/dependabot.yml.
    config:
      policies:
        'actions/*': ref-pin
        '*': hash-pin
  self-repository:
    # zizmor asks for the `$/` form of a local action in place of `./`. The
    # change is only one of style, and it has no effect on security.
    disable: true
