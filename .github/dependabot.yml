version: 2

updates:
  # Dependabot covers GitHub Actions alone. Renovate covers npm and pnpm, and
  # renovate.json disables its `github-actions` manager. The split is the point:
  # two bots on one ecosystem open duplicate pull requests for the same bump and
  # then fight over the lockfile.
  - package-ecosystem: github-actions
    # `/` means the whole repository for this ecosystem. Dependabot finds
    # `.github/workflows/*` on its own; it does not take the workflow directory.
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # One pull request for the whole set. ci.yml pins `actions/checkout`,
    # `actions/setup-node`, `actions/cache`, and `pnpm/action-setup` to major
    # tags, and a major tag moves rarely, so separate pull requests buy nothing.
    groups:
      github-actions:
        patterns:
          - '*'
    commit-message:
      # commitlint.config.mjs holds a `scope-enum`, and Dependabot's default
      # `deps` scope is not a member. An absent scope passes, because
      # config-conventional leaves `scope-empty` off. A configured prefix also
      # makes Dependabot write a lower-case `bump`, which `subject-case` needs.
      prefix: chore
