# The configuration of actionlint (.github/workflows/workflow-lint.yml).
paths:
  .github/workflows/**/*.{yml,yaml}:
    ignore:
      # actionlint 1.7.12 does not know the `code-quality` permission, which
      # the upload of coverage to GitHub Code Quality needs (ci.yml). Remove
      # this entry when a release of actionlint adds the permission.
      - 'unknown permission scope "code-quality"'
