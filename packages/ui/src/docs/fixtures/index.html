<!doctype html>
<html lang="en" class="antialiased">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Fixtures</title>
		<link rel="stylesheet" href="./app.css" />
	</head>
	<body class="bg-white dark:bg-zinc-950 text-zinc-950 dark:text-white">
		<div id="root"></div>
		<script>
			// The theme follows the color scheme of the system, and the density
			// follows the stored level, as on the docs site. `visual.ts` sets both.
			let d = null

			try {
				d = localStorage.getItem('density')
			} catch {}

			if (matchMedia('(prefers-color-scheme: dark)').matches) {
				document.documentElement.classList.add('dark')
			}

			const steps = { loose: 'lg', snug: 'md', compact: 'sm' }

			const step = Object.hasOwn(steps, d) ? steps[d] : 'md'

			if (step !== 'md') document.documentElement.classList.add(`density-root-${step}`)
		</script>
		<script type="module" src="./main.tsx"></script>
	</body>
</html>
