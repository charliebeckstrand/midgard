<!doctype html>
<html lang="en" class="antialiased">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Docs</title>
		<!-- The preload fetches the font with the document, and not after the first
		     layout finds text in it. `engine/fonts.css` gives the font face. -->
		<link
			rel="preload"
			href="./engine/fonts/GoogleSansFlex-VariableFont.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<!-- Linked here, never imported from `main.tsx` — an import delays the
		     styles until the whole module graph loads. See engine/README.md. -->
		<link rel="stylesheet" href="./app.css" />
	</head>
	<!-- No full height here. The sidebar layout sets its own height: below lg the
	     page scrolls, and from lg up the layout is pinned to the viewport. The body
	     color matches the layout, so an overscroll shows no band. -->
	<body class="bg-white lg:bg-zinc-100 dark:bg-zinc-950 text-zinc-950 dark:text-white">
		<div id="root"></div>
		<script>
			// A copy of the script of `AppearanceScript`, which this page cannot render.
			// `providers/appearance.test.tsx` holds the two to the same results.
			//
			// Pre-hydration theme and density paint. The theme must resolve the stored
			// preference the same way `AppearanceProvider` and `AppearanceScript` do, or a dark-OS visitor
			// flashes light on every load until React's post-paint effect corrects
			// it. The hook treats anything but an explicit 'light'/'dark' — 'system',
			// absent, or a stale/corrupt value — as follow-the-OS, so mirror that:
			// go dark for 'dark', or for any non-'light' value when the OS is dark.
			// Storage access can throw (blocked cookies, embedded contexts); fall
			// back to the OS preference rather than letting the script abort.
			let t = null

			let d = null

			try {
				t = localStorage.getItem('theme')

				d = localStorage.getItem('density')
			} catch {}

			const systemDark = matchMedia('(prefers-color-scheme: dark)').matches

			if (t === 'dark' || (t !== 'light' && systemDark)) {
				document.documentElement.classList.add('dark')
			}

			// The density step, as `AppearanceScript` writes it: the root element is
			// the density scope of the app, so the stored density applies at the
			// first paint. Any value that is not a level gives the step of 'snug'.
			// A step other than `md` adds its class, and `md` adds no mark.
			const steps = { loose: 'lg', snug: 'md', compact: 'sm' }

			const step = Object.hasOwn(steps, d) ? steps[d] : 'md'

			if (step !== 'md') document.documentElement.classList.add(`density-root-${step}`)
		</script>
		<script type="module" src="./main.tsx"></script>
	</body>
</html>
