packages:
  - apps/*
  - packages/*

# This block holds one version for each dependency that two or more workspaces
# share. A member manifest writes `catalog:` in place of the range, so a bump
# edits one line here rather than every manifest that names the package. A peer
# range stays literal in its manifest, because it states a compatibility
# contract and not a version to track.
catalog:
  '@biomejs/biome': ^2.5.14
  '@simplewebauthn/browser': ^14.0.0
  '@tailwindcss/postcss': ^4.1.0
  '@tanstack/react-query': ^5.101.2
  '@types/d3-geo': ^3.1.0
  '@types/node': ^25.3.3
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@types/topojson-client': ^3.1.5
  babel-plugin-react-compiler: ^1.0.0
  d3-geo: ^3.1.1
  lucide-react: ^1.21.0
  next: ^16.3.3
  openapi-fetch: ^0.17.0
  react: ^19.3.0
  react-dom: ^19.3.0
  tailwindcss: ^4.3.0
  topojson-client: ^3.1.0
  tsup: ^8.5.1
  typescript: ^7.0.2
  us-atlas: ^3.0.1
  vitest: 4.1.11
  world-atlas: ^2.0.2

# `auth` and `shared` generate their API types with `openapi-typescript`, which
# reads the JavaScript API of TypeScript through its peer. TypeScript 7 has no
# such API, so these two packages keep TypeScript 6. The apps and `ui` check
# with TypeScript 7, and `next build` runs its CLI.
catalogs:
  typescript6:
    typescript: ^6.0.3

allowBuilds:
  '@percy/core': false
  esbuild: false
  lefthook: true
  protobufjs: false
  sharp: false

# pnpm gives a package one copy for each set of peers that it resolves to. The
# optional peers of `next` reach `supports-color` through `@babel/core` and
# `debug`, and two versions of `supports-color` are in the graph. Without this
# setting, `next` had two copies, and `shared` did not use the same copy as all
# of the apps. Thus a type from `next` that `shared` exports did not match the
# same type in an app. This setting compares only the versions of the peers, so
# the workspace keeps one copy of `next`.
dedupePeers: true

# These entries set a minimum safe version for transitive packages with known
# advisories. Each entry is a range, not a pin. pnpm resolves the newest match,
# so a lockfile refresh carries the floor forward without an edit here. Renovate
# reads this block too, and its range edit drops the floor, so a rule in
# renovate.json keeps it away from these entries.
overrides:
  esbuild: '>=0.28.2 <0.29'
  postcss: '>=8.5.28 <9'
  undici: '>=7.29.0 <8'

minimumReleaseAgeExclude:
  - hlidskjalf

# `useFloatingPortalNode` builds its portal node in a layout effect and removes it in that
# effect's cleanup, deliberately rebuilding it on the next run (floating-ui#2454). React's
# `<Activity>` runs cleanups to *hide* a subtree and re-runs the effects to reveal it, so a
# parked surface came back with a new node — and since `createPortal` counts its container as
# part of the portal's identity, the whole surface remounted. Every overlay inside an inactive
# Tabs/Nav panel (`ui/primitives/mount`'s `Hold`) or a navigated-away App Router route lost its
# state on the way back. The patch re-attaches the existing node instead of rebuilding it.
# Covered by `overlay-activity-hold.test.tsx`, which fails without it. Mirrored in tms-ui; keep
# the two copies identical. Remove once upstream is Activity-safe.
#
# React Router reloads the page when a route module fails to import, so a tab that a deploy
# left on deleted chunks picks up the new build. It also did this for a prefetch: `prefetch="intent"`
# starts on `touchstart`, so a scroll that started on a link reloaded the page, and an open menu
# closed. The patch makes a failed prefetch give no links. A failed navigation still reloads, but
# it loads the page of the navigation: React Router reloaded the current page, so a pick in the
# menu of a stale tab stayed on the page it left.
# A navigation also preloads all the chunks of its route, from the `imports` of the manifest.
# React Router imported only the route module, so the browser found each level of chunks after
# the level above it loaded. The Grid page waited for about 10 rounds of requests, and the
# Dashboard page for about 20.
# Remove once upstream stops reloading on a prefetch and preloads the chunks of a navigation.
patchedDependencies:
  '@floating-ui/react@0.27.20': patches/@floating-ui__react@0.27.20.patch
  react-router@8.4.0: patches/react-router@8.4.0.patch
