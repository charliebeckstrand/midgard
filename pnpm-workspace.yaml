packages:
  - apps/*
  - packages/*

# This block holds one version for each dependency that two or more workspaces
# share. A member manifest writes `catalog:` in place of the range, so a bump
# edits one line here rather than every manifest that names the package. A peer
# range stays literal in its manifest, because it states a compatibility
# contract and not a version to track.
catalog:
  '@biomejs/biome': ^2.6.8
  '@simplewebauthn/browser': ^14.0.0
  '@tailwindcss/postcss': ^4.1.0
  '@tanstack/react-query': ^5.101.2
  '@testing-library/react': ^16.3.3
  '@types/d3-geo': ^3.1.0
  '@types/node': ^24.19.2
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@types/topojson-client': ^3.1.5
  babel-plugin-react-compiler: ^1.0.0
  d3-geo: ^3.1.1
  jsdom: ^30.1.3
  lucide-react: ^1.21.0
  next: 16.4.6
  openapi-fetch: ^0.17.0
  openapi-typescript: ^7.13.0
  react: 19.3.1
  react-dom: 19.3.1
  tailwindcss: ^4.3.0
  topojson-client: ^3.1.0
  tsup: ^8.5.1
  tsx: ^4.19.0
  typescript: ^7.0.2
  us-atlas: ^3.0.1
  vitest: 5.0.5
  world-atlas: ^2.0.2

# `auth` and `shared` generate their API types with `openapi-typescript`, which
# reads the JavaScript API of TypeScript through its peer. TypeScript 7 has no
# such API, so these two packages keep TypeScript 6. The apps and `ui` check
# with TypeScript 7, and `next build` runs its CLI.
catalogs:
  typescript6:
    typescript: ^6.0.3

allowBuilds:
  esbuild: false
  lefthook: true
  protobufjs: false
  sharp: false

# pnpm gives a package one copy for each set of peers that it resolves to. The
# optional peers of `next` reach `supports-color` through `@babel/core` and
# `debug`, and two versions of `supports-color` are in the graph. Without this
# setting, `next` had two copies, and `shared` did not use the same copy as all
# of the apps. Thus a type from `next` that `shared` exports did not match the
# same type in an app. This setting compares only the versions of the peers, so
# the workspace keeps one copy of `next`.
dedupePeers: true

# These entries set a minimum safe version for transitive packages with known
# advisories. Each entry is a range, not a pin. pnpm resolves the newest match,
# so a lockfile refresh carries the floor forward without an edit here. Renovate
# reads this block too, and its range edit drops the floor, so a rule in
# renovate.json keeps it away from these entries.
overrides:
  esbuild: '>=0.28.2 <0.29'
  postcss: '>=8.5.28 <9'
  undici: '>=7.30.1 <8'

minimumReleaseAgeExclude:
  - hlidskjalf

# `useFloatingPortalNode` of `@floating-ui/react` builds its portal node in a layout effect.
# The cleanup of that effect removes the node and clears the ref, so the next run builds a
# new node (floating-ui#2454). React `<Activity>` runs the cleanups to hide a subtree, and it
# runs the effects again to show the subtree. `createPortal` counts its container as part of
# the identity of the portal, so a new node remounts the whole surface.
#
# Thus each overlay in a hidden Tabs or Nav panel lost its state when the panel came back
# (`Hold` of `ui/primitives/mount`). An overlay in an App Router route lost its state in the
# same way when the reader came back to the route. The patch keeps the node and attaches it
# again. `overlay-activity-hold.test.tsx` fails without the patch. tms-ui has a copy of this
# patch, and the two copies must stay the same. Remove the patch when upstream is safe under
# `<Activity>`.
#
# React Router reloads the page when a route module fails to import. Thus a tab that a deploy
# left on deleted chunks gets the new build. It also reloaded the page for a failed prefetch.
# `prefetch="intent"` starts on `touchstart`, so a scroll that started on a link reloaded the
# page and closed an open menu. The patch makes a failed prefetch give no links.
#
# A failed navigation still reloads, but the patch makes it load the page of the navigation.
# React Router reloaded the current page, so a pick in the menu of a stale tab stayed on the
# page that it left.
#
# The patch also makes a navigation preload each chunk of its route, from the `imports` of the
# manifest. React Router imported only the route module, so the browser found each level of
# chunks after the level above it loaded. The Grid page waited for about 10 rounds of
# requests, and the Dashboard page waited for about 20.
#
# The preload also takes the route module, at the start of the navigation. Vite wraps the
# import of React Router in its preload helper, which starts the import one microtask later.
# A render that the click queued first, such as the close of the mobile sidebar, then ran
# before the request started.
#
# `route-module-load.test.tsx` fails without each of the three changes to React Router.
# Remove the patch when upstream stops the reload for a prefetch and preloads the chunks of a
# navigation.
#
# Under `isolate: false`, Vitest runs each setup file again for each test file. It finds the
# module to run again by its URL, but the module keeps the URL of the first request for it. A
# `--changed` run (`test:changed`) first reads each setup file by its absolute path, and the
# fs module cache keeps that URL for later runs. The worker then asks for `/src/...`, finds no
# module, and does not run the setup again.
#
# Thus the `afterEach` cleanup of the setup runs only for the first file of a worker. Each later
# file finds the DOM and the stubs of the files before it. The patch also finds the module by
# its id. Remove the patch when upstream finds the module by its id.
#
# React listens for each event on the container of its root. React Router and the Next.js App
# Router hydrate the document, so that container is the document. On iOS, WebKit joins two
# quick taps into one double-click when a node at the tap listens for `dblclick` and allows a
# double tap (`nodeRespondingToDoubleClickEvent`). An element allows it only when it and each
# of its ancestors have `touch-action: auto`. The root style of `ui/core/touch/base.ts` is
# `manipulation`, so no element allows it. The document is not an element, and it always
# allows a double tap.
#
# Thus the second of two quick taps near each other got no click, and the target of the first
# tap got a second click. On an iPhone, a test page with React 18 and its root on the document
# missed 13 of 58 quick taps. With its root on a div, the page missed 0 of 64.
#
# The patch puts the `dblclick` listeners of a root on the document on its root element. Each
# listener keeps the document as its container, so `onDoubleClick` works as before. The
# listener must not go on `window`. Since WebKit 302274@main, a `dblclick` listener on
# `window` starts the double tap too, and `window` has no touch-action.
#
# `next` has its own copies of `react-dom` for the App Router, so it has the same patch.
# `react` must have the version of `react-dom`, so it is pinned too.
# `react-double-click.test.tsx` covers the patch. Remove the patch when one of two upstream
# fixes lands. In WebKit bug 216681, the document follows the touch-action of the root
# element. In React issue 31260, React stops listening for `dblclick` on a document.
#
# Each key names one exact version, and pnpm stops an install when a patch matches no package.
# Thus each package.json pins a patched package at that version, so that a lockfile refresh
# cannot move it. A bump makes a new patch for the new version, and renovate.json holds each
# bump for approval.
patchedDependencies:
  '@floating-ui/react@0.27.20': patches/@floating-ui__react@0.27.20.patch
  next@16.4.6: patches/next@16.4.6.patch
  react-dom@19.3.1: patches/react-dom@19.3.1.patch
  react-router@8.4.0: patches/react-router@8.4.0.patch
  vitest@5.0.5: patches/vitest@5.0.5.patch
