packages:
  - apps/*
  - packages/*

# This block holds one version for each dependency that two or more workspaces
# share. A member manifest writes `catalog:` in place of the range, so a bump
# edits one line here rather than every manifest that names the package. A peer
# range stays literal in its manifest, because it states a compatibility
# contract and not a version to track.
catalog:
  '@biomejs/biome': ^2.5.14
  '@tailwindcss/postcss': ^4.1.0
  '@tanstack/react-query': ^5.101.2
  '@types/d3-geo': ^3.1.0
  '@types/node': ^25.3.3
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.3
  '@types/topojson-client': ^3.1.5
  babel-plugin-react-compiler: ^1.0.0
  d3-geo: ^3.1.1
  lucide-react: ^1.21.0
  next: ^16.3.3
  react: ^19.2.7
  react-dom: ^19.2.7
  tailwindcss: ^4.3.0
  topojson-client: ^3.1.0
  tsup: ^8.5.1
  typescript: ^6.0.3
  us-atlas: ^3.0.1
  vitest: 4.1.11
  world-atlas: ^2.0.2

allowBuilds:
  esbuild: false
  lefthook: true
  sharp: false

# These entries set a minimum safe version for transitive packages with known
# advisories. Each entry is a range, not a pin. pnpm resolves the newest match,
# so a lockfile refresh carries the floor forward without an edit here. Renovate
# reads this block too, and its range edit drops the floor, so a rule in
# renovate.json keeps it away from these entries.
overrides:
  esbuild: '>=0.28.2 <0.29'
  postcss: '>=8.5.28 <9'
  sharp: '>=0.35.0 <1'
  undici: '>=7.29.0 <8'

minimumReleaseAgeExclude:
  - hlidskjalf@0.3.1 || 0.3.2 || 0.3.3 || 0.3.4 || 0.3.5 || 0.3.6 || 0.3.7 || 0.4.0 || 0.4.4
  - '@mui/x-data-grid@9.9.0'
  - '@mui/x-internals@9.9.0'
  - '@mui/x-virtualizer@0.6.0'

# `useFloatingPortalNode` builds its portal node in a layout effect and removes it in that
# effect's cleanup, deliberately rebuilding it on the next run (floating-ui#2454). React's
# `<Activity>` runs cleanups to *hide* a subtree and re-runs the effects to reveal it, so a
# parked surface came back with a new node — and since `createPortal` counts its container as
# part of the portal's identity, the whole surface remounted. Every overlay inside an inactive
# Tabs/Nav panel (`ui/primitives/mount`'s `Hold`) or a navigated-away App Router route lost its
# state on the way back. The patch re-attaches the existing node instead of rebuilding it.
# Covered by `overlay-activity-hold.test.tsx`, which fails without it. Mirrored in tms-ui; keep
# the two copies identical. Remove once upstream is Activity-safe.
patchedDependencies:
  '@floating-ui/react@0.27.19': patches/@floating-ui__react@0.27.19.patch
