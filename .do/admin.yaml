# App Platform spec for the admin app. The deploy workflow applies it on each push
# to main, and the first run creates the app. App Platform builds the image from
# the Dockerfile at the repository root and sends each build-time variable below
# to it as a build argument.
name: admin
region: nyc

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

# `zone` lets App Platform manage the DNS record in the ivoryimage.dev domain.
domains:
  - domain: admin.ivoryimage.dev
    type: PRIMARY
    zone: ivoryimage.dev

ingress:
  rules:
    - component:
        name: admin
      match:
        path:
          prefix: /

services:
  - name: admin
    github:
      repo: charliebeckstrand/midgard
      branch: main
      deploy_on_push: false
    dockerfile_path: Dockerfile
    http_port: 3000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    envs:
      - key: APP
        scope: BUILD_TIME
        value: admin
      # `next build` writes the gateway origin into the rewrites, and the server
      # reads it at start, so the build and the run both need it.
      - key: BIFROST_URL
        scope: RUN_AND_BUILD_TIME
        value: https://auth.ivoryimage.dev
