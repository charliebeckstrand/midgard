# App Platform spec for midgard: one app that serves the admin app, the places
# app, the picks app, and the docs site of `ui`, each on its own subdomain. The
# deploy workflow applies it on each push to main, and the first run creates the
# app. The three Next apps build from the Dockerfile at the repository root, which gets each
# build-time variable below as a build argument. The docs site builds from
# Dockerfile.docs.
name: midgard
region: nyc

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

# `zone` lets App Platform manage the DNS records in the ivoryimage.dev domain.
domains:
  - domain: admin.ivoryimage.dev
    type: PRIMARY
    zone: ivoryimage.dev
  - domain: places.ivoryimage.dev
    type: ALIAS
    zone: ivoryimage.dev
  - domain: picks.ivoryimage.dev
    type: ALIAS
    zone: ivoryimage.dev
  - domain: docs.ivoryimage.dev
    type: ALIAS
    zone: ivoryimage.dev

# Each rule sends one subdomain to one component. The `authority` match reads
# the host of the request.
ingress:
  rules:
    - component:
        name: admin
      match:
        authority:
          exact: admin.ivoryimage.dev
        path:
          prefix: /
    - component:
        name: places
      match:
        authority:
          exact: places.ivoryimage.dev
        path:
          prefix: /
    - component:
        name: picks
      match:
        authority:
          exact: picks.ivoryimage.dev
        path:
          prefix: /
    - component:
        name: docs
      match:
        authority:
          exact: docs.ivoryimage.dev
        path:
          prefix: /

services:
  - name: admin
    github:
      repo: charliebeckstrand/midgard
      branch: main
      deploy_on_push: false
    dockerfile_path: Dockerfile
    http_port: 3000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    # The same limits as bifrost. One small instance serves each app, so a crash
    # loop or a leak takes the subdomain down.
    alerts:
      - rule: RESTART_COUNT
        operator: GREATER_THAN
        value: 2
        window: FIVE_MINUTES
      - rule: MEM_UTILIZATION
        operator: GREATER_THAN
        value: 80
        window: TEN_MINUTES
      - rule: CPU_UTILIZATION
        operator: GREATER_THAN
        value: 80
        window: TEN_MINUTES
    # The proxy fails each request when CLIENT_IP_SECRET is not set, so this
    # check stops a deploy that lost the secret. Without a session, `/` is a
    # redirect that the proxy sends, and the check does not call the gateway.
    health_check:
      http_path: /
    envs:
      - key: APP
        scope: BUILD_TIME
        value: admin
      # `next build` writes the gateway origin into the rewrites, and the server
      # reads it at start, so the build and the run both need it.
      - key: BIFROST_URL
        scope: RUN_AND_BUILD_TIME
        value: https://auth.ivoryimage.dev
      # The gateway uses the browser address that the proxy sends only with
      # this secret. The gateway holds the same value.
      - key: CLIENT_IP_SECRET
        scope: RUN_TIME
        type: SECRET
        value: ${CLIENT_IP_SECRET}

  - name: places
    github:
      repo: charliebeckstrand/midgard
      branch: main
      deploy_on_push: false
    dockerfile_path: Dockerfile
    http_port: 3000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    # The same reason as for admin.
    alerts:
      - rule: RESTART_COUNT
        operator: GREATER_THAN
        value: 2
        window: FIVE_MINUTES
      - rule: MEM_UTILIZATION
        operator: GREATER_THAN
        value: 80
        window: TEN_MINUTES
      - rule: CPU_UTILIZATION
        operator: GREATER_THAN
        value: 80
        window: TEN_MINUTES
    # The same reason as for admin.
    health_check:
      http_path: /
    envs:
      - key: APP
        scope: BUILD_TIME
        value: places
      # The same reason as for admin.
      - key: BIFROST_URL
        scope: RUN_AND_BUILD_TIME
        value: https://auth.ivoryimage.dev
      # The same reason as for admin.
      - key: CLIENT_IP_SECRET
        scope: RUN_TIME
        type: SECRET
        value: ${CLIENT_IP_SECRET}

  - name: picks
    github:
      repo: charliebeckstrand/midgard
      branch: main
      deploy_on_push: false
    dockerfile_path: Dockerfile
    http_port: 3000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    # The same reason as for admin.
    alerts:
      - rule: RESTART_COUNT
        operator: GREATER_THAN
        value: 2
        window: FIVE_MINUTES
      - rule: MEM_UTILIZATION
        operator: GREATER_THAN
        value: 80
        window: TEN_MINUTES
      - rule: CPU_UTILIZATION
        operator: GREATER_THAN
        value: 80
        window: TEN_MINUTES
    # The same reason as for admin.
    health_check:
      http_path: /
    envs:
      - key: APP
        scope: BUILD_TIME
        value: picks
      # The same reason as for admin.
      - key: BIFROST_URL
        scope: RUN_AND_BUILD_TIME
        value: https://auth.ivoryimage.dev
      # The same reason as for admin.
      - key: CLIENT_IP_SECRET
        scope: RUN_TIME
        type: SECRET
        value: ${CLIENT_IP_SECRET}

static_sites:
  # The build writes each page to `<path>/index.html`. A path with no page gets
  # the fallback document, and the app shows its own page for it.
  - name: docs
    github:
      repo: charliebeckstrand/midgard
      branch: main
      deploy_on_push: false
    dockerfile_path: Dockerfile.docs
    # The path in the built image.
    output_dir: /app/packages/ui/src/docs/dist/client
    catchall_document: __spa-fallback.html
