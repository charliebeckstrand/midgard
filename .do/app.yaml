# App Platform spec for midgard: one app that serves the admin app, the places
# app, the elections app, the numbers app, and the docs site of `ui`, each on
# its own subdomain. The deploy workflow applies it on each push to main, and
# the first run creates the app. Each service runs an image from the container
# registry of the account. The workflow builds each image from the commit of
# its run, from the Dockerfile at the repository root or from Dockerfile.docs,
# and puts the commit SHA in place of IMAGE_TAG. `registry` stays empty, as App
# Platform asks for a DOCR registry.
name: midgard
region: nyc

# The edge of App Platform changes each email address in an HTML response to
# "[email protected]" and adds a script that puts the address back. The first
# paint then shows the stand-in text and not the address, such as in the Grid
# demos of the docs and the user lists of admin. The setting applies to all the
# domains of the app.
disable_email_obfuscation: true

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

# `zone` lets App Platform manage the DNS records in the ivoryimage.dev domain.
domains:
  - domain: admin.ivoryimage.dev
    type: PRIMARY
    zone: ivoryimage.dev
  - domain: places.ivoryimage.dev
    type: ALIAS
    zone: ivoryimage.dev
  - domain: docs.ivoryimage.dev
    type: ALIAS
    zone: ivoryimage.dev
  - domain: elections.ivoryimage.dev
    type: ALIAS
    zone: ivoryimage.dev
  - domain: numbers.ivoryimage.dev
    type: ALIAS
    zone: ivoryimage.dev

# Each rule sends one subdomain to one component. The `authority` match reads
# the host of the request.
ingress:
  rules:
    - component:
        name: admin
      match:
        authority:
          exact: admin.ivoryimage.dev
        path:
          prefix: /
    - component:
        name: places
      match:
        authority:
          exact: places.ivoryimage.dev
        path:
          prefix: /
    - component:
        name: docs-server
      match:
        authority:
          exact: docs.ivoryimage.dev
        path:
          prefix: /
    - component:
        name: elections
      match:
        authority:
          exact: elections.ivoryimage.dev
        path:
          prefix: /
    - component:
        name: numbers
      match:
        authority:
          exact: numbers.ivoryimage.dev
        path:
          prefix: /

services:
  - name: admin
    image:
      registry_type: DOCR
      repository: admin
      tag: ${IMAGE_TAG}
    http_port: 3000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    # The same limits as bifrost. One small instance serves each app, so a crash
    # loop or a leak takes the subdomain down.
    alerts:
      - rule: RESTART_COUNT
        operator: GREATER_THAN
        value: 2
        window: FIVE_MINUTES
      - rule: MEM_UTILIZATION
        operator: GREATER_THAN
        value: 80
        window: TEN_MINUTES
      - rule: CPU_UTILIZATION
        operator: GREATER_THAN
        value: 80
        window: TEN_MINUTES
    # The proxy fails each request when CLIENT_IP_SECRET is not set, so this
    # check stops a deploy that lost the secret. Without a session, `/` is a
    # redirect that the proxy sends, and the check does not call the gateway.
    health_check:
      http_path: /
    envs:
      # `next build` writes the gateway origin into the rewrites, and the server
      # reads it at start. deploy.yml gives this value to the build of the
      # image, and App Platform gives it to the run.
      - key: BIFROST_URL
        scope: RUN_TIME
        value: https://auth.ivoryimage.dev
      # The gateway uses the browser address that the proxy sends only with
      # this secret. The gateway holds the same value.
      - key: CLIENT_IP_SECRET
        scope: RUN_TIME
        type: SECRET
        value: ${CLIENT_IP_SECRET}

  - name: places
    image:
      registry_type: DOCR
      repository: places
      tag: ${IMAGE_TAG}
    http_port: 3000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    # The same reason as for admin.
    alerts:
      - rule: RESTART_COUNT
        operator: GREATER_THAN
        value: 2
        window: FIVE_MINUTES
      - rule: MEM_UTILIZATION
        operator: GREATER_THAN
        value: 80
        window: TEN_MINUTES
      - rule: CPU_UTILIZATION
        operator: GREATER_THAN
        value: 80
        window: TEN_MINUTES
    # The same reason as for admin.
    health_check:
      http_path: /
    envs:
      # The same reason as for admin.
      - key: BIFROST_URL
        scope: RUN_TIME
        value: https://auth.ivoryimage.dev
      # The same reason as for admin.
      - key: CLIENT_IP_SECRET
        scope: RUN_TIME
        type: SECRET
        value: ${CLIENT_IP_SECRET}

  # The elections app is public. It has no sign-in and does not call the
  # gateway, so it needs no BIFROST_URL and no CLIENT_IP_SECRET. Its server
  # reads civicAPI, also during `next build`, which prerenders the pages.
  - name: elections
    image:
      registry_type: DOCR
      repository: elections
      tag: ${IMAGE_TAG}
    http_port: 3000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    # The same reason as for admin.
    alerts:
      - rule: RESTART_COUNT
        operator: GREATER_THAN
        value: 2
        window: FIVE_MINUTES
      - rule: MEM_UTILIZATION
        operator: GREATER_THAN
        value: 80
        window: TEN_MINUTES
      - rule: CPU_UTILIZATION
        operator: GREATER_THAN
        value: 80
        window: TEN_MINUTES
    health_check:
      http_path: /

  # Sign-in is optional in the numbers app, and no page needs a session. `/`
  # sends the reader to the address of a new seed.
  - name: numbers
    image:
      registry_type: DOCR
      repository: numbers
      tag: ${IMAGE_TAG}
    http_port: 3000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    # The same reason as for admin.
    alerts:
      - rule: RESTART_COUNT
        operator: GREATER_THAN
        value: 2
        window: FIVE_MINUTES
      - rule: MEM_UTILIZATION
        operator: GREATER_THAN
        value: 80
        window: TEN_MINUTES
      - rule: CPU_UTILIZATION
        operator: GREATER_THAN
        value: 80
        window: TEN_MINUTES
    health_check:
      http_path: /
    envs:
      # The same reason as for admin.
      - key: BIFROST_URL
        scope: RUN_TIME
        value: https://auth.ivoryimage.dev
      # The same reason as for admin.
      - key: CLIENT_IP_SECRET
        scope: RUN_TIME
        type: SECRET
        value: ${CLIENT_IP_SECRET}

  # The docs site of `ui`. The build writes each page to `<path>/index.html`,
  # and in each other language to `<path>/index.<locale>.html`, such as
  # `index.es.html`. The server sends the HTML of the locale of the request at
  # the same path, so the first paint is in the language of the reader. A path
  # with no page gets the fallback document, and the app shows its own page for
  # it (`packages/ui/scripts/docs/server.ts`).
  - name: docs-server
    image:
      registry_type: DOCR
      repository: docs-server
      tag: ${IMAGE_TAG}
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    # The same reason as for admin.
    alerts:
      - rule: RESTART_COUNT
        operator: GREATER_THAN
        value: 2
        window: FIVE_MINUTES
      - rule: MEM_UTILIZATION
        operator: GREATER_THAN
        value: 80
        window: TEN_MINUTES
      - rule: CPU_UTILIZATION
        operator: GREATER_THAN
        value: 80
        window: TEN_MINUTES
    health_check:
      http_path: /
